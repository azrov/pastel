name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fpc libfreetype6 fonts-dejavu-core
      - name: Build and test pastel
        run: sh build.sh test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and test the VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm run compile
          npm test
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/bin/pastel" new app ci-demo)
          PASTEL_BIN="$GITHUB_WORKSPACE/bin/pastel" npm run test:integration -- "$RUNNER_TEMP/ci-demo"
          npm run package
