name: Website

# Pastel's website (GitHub Pages): the home page, the download page and the documentation
# from README.md, docs/ and the examples, made by tools/website, a Pastel program.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
      - name: Build pastel
        run: ./build.sh
      - name: Build the site
        working-directory: tools/website
        run: SITE_REPO="$GITHUB_REPOSITORY" ../../bin/pastel run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
