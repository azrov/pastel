# Settings while developing. Environment variables work too: NOTES_API_SERVER_PORT=9000
[server]
port = 8080
address = "127.0.0.1"   # only this computer; "0.0.0.0" for the network
# cors = ["https://my-app.example.com"]   # web pages elsewhere that may call the API
# trust_proxy = true                      # behind nginx/Caddy

[log]
level = "info"

[api]
# keys = ["put-a-long-random-key-here"]   # then the API needs header X-API-Key
