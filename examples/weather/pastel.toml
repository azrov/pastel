# Example: a command-line tool that calls a web API (Open-Meteo, free, no key).
# Try it: pastel run -- Baku

[project]
name = "weather"
version = "1.0.0"
pastel = "1.0"
type = "console"

[build]
main = "src/main.pas"
mode = "objfpc"

[targets]
platforms = ["linux", "windows", "rpi"]

[package]
include = ["README.md", "config.example.toml"]
