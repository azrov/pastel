# Example: a desktop address book that keeps its contacts in SQLite.
# Try it: pastel run

[project]
name = "contacts"
version = "1.0.0"
pastel = "0.7"
title = "Contacts"
description = "An address book"
type = "app"

[build]
main = "src/main.pas"
mode = "objfpc"

[targets]
platforms = ["linux", "windows"]

[package]
include = ["README.md"]
